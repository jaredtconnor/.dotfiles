# herdr configuration
# Single source of truth: home/.chezmoitemplates/herdr/config.toml.
# chezmoi renders it to ~/.config/herdr/config.toml on macOS/Linux and to
# %APPDATA%\herdr\config.toml on Windows (see the wrapper .tmpl files).
# Only non-default settings live here; `herdr --default-config` lists the rest.

onboarding = false

[theme]
name = "tokyo-night"

{{ if eq .chezmoi.os "windows" -}}
[terminal]
# herdr otherwise launches Windows PowerShell 5.1, which never loads
# ~/.config/powershell or oh-my-posh. Force PowerShell 7 to match the
# regular terminal.
default_shell = "pwsh"

{{ end -}}
[keys]
# Every action goes through the prefix so direct ctrl/alt chords stay with
# the shell and editors inside panes. Press ctrl+space, release, then the key.
prefix = "ctrl+space"

# Panes: vim-style focus, Zed-style layout
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+d"         # split right
split_horizontal = "prefix+shift+d" # split down
close_pane = "prefix+w"
zoom = "prefix+f"
resize_mode = "prefix+shift+r"

# Tabs
new_tab = "prefix+t"
switch_tab = "prefix+1..9"
previous_tab = "prefix+ctrl+p"
next_tab = "prefix+ctrl+n"

# Workspaces
workspace_picker = "prefix+p"
switch_workspace = "prefix+alt+1..9"
previous_workspace = "prefix+shift+l" # tmux last-session
close_workspace = "prefix+shift+q"    # default prefix+shift+d is split_horizontal

# Agents and UI
focus_agent = "prefix+ctrl+1..9"
toggle_sidebar = "prefix+b"
reload_config = "prefix+r"
goto = "" # prefix+g opens lazygit below

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

[ui]
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = false

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = true
